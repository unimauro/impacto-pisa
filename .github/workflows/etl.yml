name: ETL mensual (INGEMMET/MINEM) y detección de cambios
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow requests shapely numpy scipy statsmodels pytest
      - name: Descargar capas ArcGIS (GEOCATMIN)
        run: python etl/arcgis.py
      - name: Copiar geojson y fuentes derivadas versionadas
        run: ls data/raw | head -50
      - name: Reconstruir distritos y análisis (requiere sinadef_distrital.csv versionado)
        run: python etl/build_distritos.py && python etl/analisis.py && python -m pytest -q tests
      - name: Commit si cambió
        run: |
          git config user.name "etl-bot" && git config user.email "etl-bot@users.noreply.github.com"
          git add app/public/data && git diff --cached --quiet || git commit -m "data: refresco automático $(date -u +%F)" && git push
